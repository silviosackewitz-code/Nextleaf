[package]
name = "nextleaf-desktop"
version = "0.1.2"
license = "GPL-3.0-only"
repository = "https://github.com/silviosackewitz-code/Nextleaf"
description = "Nextleaf Desktop"
authors = ["Nextleaf contributors"]
edition = "2021"

[lib]
name = "nextleaf_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

nextleaf-server = { path = "../backend" }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
dirs = "6"
