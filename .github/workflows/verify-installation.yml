name: Verify public installation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download and verify release files without authentication
        run: |
          mkdir release-check
          cd release-check
          BASE=https://github.com/silviosackewitz-code/Nextleaf/releases/download/install-v0.1.0-r3
          wget --https-only "$BASE/docker-compose.yml" "$BASE/example.env" "$BASE/SHA256SUMS"
          sha256sum --check --ignore-missing SHA256SUMS
          cmp docker-compose.yml ../deploy/release/docker-compose.yml
          cmp example.env ../deploy/release/example.env
          docker compose --env-file example.env -f docker-compose.yml config --format json > config.json
          python3 - <<'PYCONFIG'
          import json
          config = json.load(open('config.json'))['services']['nextleaf']
          assert config['image'] == 'ghcr.io/silviosackewitz-code/nextleaf:0.1.0'
          mount = next(v for v in config['volumes'] if v['target'] == '/data')
          assert mount['source'] == '/srv/nextleaf'
          # Compose versions may omit false fields from normalized JSON.
          assert mount.get('bind', {}).get('create_host_path', False) is False
          PYCONFIG
      - name: Pull and install without registry credentials
        shell: bash
        run: |
          export DOCKER_CONFIG="$(mktemp -d)"
          IMAGE=ghcr.io/silviosackewitz-code/nextleaf:0.1.0
          docker pull "$IMAGE"
          python3 deploy/check_container.py --image "$IMAGE"
